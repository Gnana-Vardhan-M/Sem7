 return{out:out,miss:miss}}
const tasks=x=>{const t=[["m","Morning, main study",x.m]];if(x.e!=="None")t.push(["e","Evening, second subject",x.e]);t.push(["n","Night, 20 minutes","Review due cards. Write today's mistakes in your notebook."]);
 return t.map(a=>({key:x.d+a[0],lab:a[1],txt:a[2],done:a[0]==="n"?!!S.done[x.d+"n"]:isDone(x.d,a[0])}))
 .concat((ADJ.out[x.d]||[]).map(m=>({key:"cu"+m.d+m.k,lab:"Catch-up from "+fmt(m.d,{weekday:"short",day:"numeric",month:"short"})+", about 60 to 90 min",txt:m.txt,done:!!S.done["cu"+m.d+m.k],cu:1})))};
const dayDone=x=>tasks(x).every(t=>t.done||(S.skip[x.d]&&t.key.slice(-1)==="n"&&!t.cu));
let tm={m:"Focus",l:3000,run:null};
const tmTxt=()=>tm.m+" "+String(Math.floor(tm.l/60)).padStart(2,"0")+":"+String(tm.l%60).padStart(2,"0");
function tmToggle(){if(tm.run){clearInterval(tm.run);tm.run=null}else tm.run=setInterval(()=>{tm.l--;if(tm.l<=0){tm.m=tm.m==="Focus"?"Break":"Focus";tm.l=tm.m==="Focus"?3000:600;navigator.vibrate&&navigator.vibrate(300)}const e=$("#tm");if(e)e.textContent=tmTxt()},1000);render()}
function vToday(){
 const x=PLAN.find(y=>y.d===sel),i=PLAN.indexOf(x),t0=today();
 const next=EXAMS.find(e=>diff(t0,e[1])>=0),n=next?diff(t0,next[1]):null;
 const hero=next?`<div class="hero"><div class="big">${n===0?"Today":n}<span>${n===0?next[0]+" exam":n===1?"day to "+next[0]:"days to "+next[0]}</span></div><p>${next[0]} is next. Your plan starts on ${fmt(PLAN[0].d,{day:"numeric",month:"short"})}.</p></div>`:`<div class="hero"><div class="big">Done</div><p>All exams finished. Well done.</p></div>`;
 const chips=EXAMS.map(e=>{const k=diff(t0,e[1]);return `<div class="chip ${k>=0&&k<=3?"hot":""}"><b>${k<0?"✓":k===0?"Today":k+" d"}</b><small>${e[0]}</small></div>`}).join("");
 const done=PLAN.filter(dayDone).length,nm=ADJ.miss.length,list=S.skip[x.d]?tasks(x).filter(t=>t.cu):tasks(x);
 const status=nm?`<div class="card"><b>Plan adjusted</b><p class="mute">${nm} missed task${nm>1?"s were":" was"} moved to your next days as catch-up rows, earliest exam first. Each adds about 60 to 90 minutes. Tap Drop on any you want to skip.</p></div>`:"";
 return hero+`<div class="chips">${chips}</div>
 ${status}<h2 style="margin-top:20px">${fmt(sel,{weekday:"long",day:"numeric",month:"long"})}</h2><small>${PH[x.p]}</small>
 ${x.x?`<div class="banner">Exam day: ${x.x}, ${x.t}</div>`:""}
 ${S.skip[x.d]?`<div class="card"><b>You skipped this day.</b><p class="mute">Its study tasks were moved to later days as catch-up.</p><button class="ghost" style="width:100%;margin-top:8px" data-a="unskip">Undo skip</button></div>`:""}
 ${list.map(t=>`<label class="task ${t.done?"on":""}"><input type="checkbox" data-k="${t.key}" ${t.done?"checked":""}><div style="flex:1"><small>${t.lab}</small><p>${esc(t.txt)}</p></div>${t.cu?`<button class="ghost" style="flex:0 0 auto" data-drop="${t.key}">Drop</button>`:""}</label>`).join("")}
 ${x.e==="None"?`<p class="mute" style="margin-top:10px">No evening session today. Rest.</p>`:""}
 ${x.d===t0&&!S.skip[x.d]&&!x.x?`<button class="ghost" style="width:100%;margin-top:10px" data-a="skip">I can't study today. Adjust my plan.</button>`:""}
 <div class="card"><small>Start every session with 5 minutes of writing what you remember from yesterday.</small>
 <div class="two" style="align-items:center;justify-content:space-between;margin-top:8px"><span class="tm" id="tm">${tmTxt()}</span><span style="display:flex;gap:8px"><button class="ghost" data-a="tm">${tm.run?"Pause":"Start"}</button><button class="ghost" data-a="tmr">Reset</button></span></div></div>
 <div class="nav2"><button class="ghost" data-nav="${i-1}" ${i?"":"disabled"}>Previous day</button><button class="ghost" data-a="now">Go to today</button><button class="ghost" data-nav="${i+1}" ${i<PLAN.length-1?"":"disabled"}>Next day</button></div>
 <h3>Progress: ${done} of ${PLAN.length} days finished</h3><div class="bar"><i style="width:${done/PLAN.length*100}%"></i></div>`}
function vPlan(){return "<h2>All days</h2><small>Tap a day to open it.</small>"+[1,2,3].map(p=>`<h3>${PH[p]}</h3>`+PLAN.filter(x=>x.p===p).map(x=>`<button class="row ${x.x?"ex":""} ${x.d===today()?"now":""}" data-day="${x.d}"><span class="dt">${fmt(x.d,{weekday:"short",day:"numeric",month:"short"})}</span><span>${esc(x.m)}</span>${(ADJ.out[x.d]||[]).length?`<i style="color:var(--hot)">+${ADJ.out[x.d].length}</i>`:""}${dayDone(x)?"<i>✓</i>":""}</button>`).join("")).join("")}
const due=()=>S.cards.map((c,i)=>i).filter(i=>S.cards[i].n<=today());
function vCards(){
 if(rev){const c=S.cards[rev.q[rev.i]];if(c)return `<h2>Card ${rev.i+1} of ${rev.q.length}</h2><div class="card big2"><small>${esc(c.s)}, box ${c.b}</small><p>${esc(c.f)}</p>${rev.show?`<hr><p>${esc(c.a)}</p>`:""}</div>`+(rev.show?`<div class="two"><button class="btn bad" data-a="miss">Missed it</button><button class="btn good" data-a="got">Got it</button></div>`:`<button class="btn" data-a="show">Show answer</button>`)+`<button class="link" data-a="stop">Stop reviewing</button>`;rev=null}
 const d=due(),cnt=b=>S.cards.filter(c=>c.b===b).length;
 return `<h2>Flashcards</h2><div class="card"><p><b style="font-size:30px">${d.length}</b> due today, ${S.cards.length} in total</p><small>Box 1: ${cnt(1)}. Box 2: ${cnt(2)}. Box 3: ${cnt(3)}.</small><button class="btn" data-a="rev" ${d.length?"":"disabled"}>Review ${d.length} due</button></div>
 <h3>Ready-made cards</h3><div class="card"><small>Made from your slides and notes. Add one subject at a time: about 25 new cards a day is plenty.</small>${(()=>{const n=DECK.filter(c=>!have(c)).length;return `<button class="btn" data-deck="*" ${n?"":"disabled"}>${n?"Add all "+n+" cards":"All cards added"}</button>`})()}${SUBJ.map(s=>{const n=DECK.filter(c=>c[0]===s&&!have(c)).length;return `<button class="ghost" style="width:100%;margin-top:8px" data-deck="${s}" ${n?"":"disabled"}>${n?"Add "+n+" "+s+" cards":s+" cards added"}</button>`}).join("")}</div>
 <h3>Add a card</h3><div class="card"><select id="cs">${SUBJ.map(s=>`<option>${s}</option>`).join("")}</select><textarea id="cf" rows="2" placeholder="Question, or 'Draw the ResNet block'"></textarea><textarea id="cb" rows="3" placeholder="Answer"></textarea><button class="btn" data-a="add">Add card</button></div>
 <h3>Your cards</h3>${S.cards.map((c,i)=>`<div class="li"><span><small>${esc(c.s)}, box ${c.b}</small><br>${esc(c.f)}</span><button data-del="${i}" aria-label="Delete card">×</button></div>`).join("")||`<p class="mute">No cards yet. Add your first one above.</p>`}`}
const vHow=()=>"<h2>How it works</h2><small>Each idea is a way to remember more in less time.</small>"+HOW.map(h=>`<div class="card"><b>${h[0]}</b><p class="mute" style="margin-top:4px">${h[1]}</p></div>`).join("");
function render(){ADJ=adjust();$("#v").innerHTML={today:vToday,plan:vPlan,cards:vCards,how:vHow}[tab]();document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.tab===tab))}
function grade(ok){const c=S.cards[rev.q[rev.i]];c.b=ok?Math.min(3,c.b+1):1;c.n=ymd(new Date(Date.now()+IV[c.b]*864e5));save();rev.i++;rev.show=false;if(rev.i>=rev.q.length)rev=null;render()}
document.addEventListener("click",e=>{const t=e.target.closest("[data-tab],[data-day],[data-a],[data-del],[data-nav],[data-deck],[data-drop]");if(!t||t.disabled)return;const d=t.dataset;
 if(d.tab){tab=d.tab;rev=null;return render()}
 if(d.deck){DECK.filter(c=>(d.deck==="*"||c[0]===d.deck)&&!have(c)).forEach(c=>S.cards.push({s:c[0],f:c[1],a:c[2],b:1,n:today()}));save();return render()}
 if(d.drop){S.drop[d.drop]=true;save();return render()}
 if(d.day){sel=d.day;tab="today";return render()}
 if(d.nav){sel=PLAN[+d.nav].d;return render()}
 if(d.del!==undefined){S.cards.splice(+d.del,1);save();return render()}
 const a=d.a;
 if(a==="now"){sel=clamp(today())}
 else if(a==="tm")return tmToggle();
 else if(a==="tmr"){clearInterval(tm.run);tm={m:"Focus",l:3000,run:null}}
 else if(a==="rev"){rev={q:due(),i:0,show:false}}
 else if(a==="show"){rev.show=true}
 else if(a==="got"||a==="miss")return grade(a==="got");
 else if(a==="stop"){rev=null}
 else if(a==="skip"){S.skip[today()]=true;save()}
 else if(a==="unskip"){delete S.skip[sel];save()}
 else if(a==="add"){const f=$("#cf").value.trim(),b=$("#cb").value.trim();if(!f||!b){alert("Write both a question and an answer.");return}S.cards.push({s:$("#cs").value,f:f,a:b,b:1,n:today()});save()}
 render()});
document.addEventListener("change",e=>{const k=e.target.dataset.k;if(k){S.done[k]=e.target.checked;save();render()}});
render();
if("serviceWorker" in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
</script></body></html>
